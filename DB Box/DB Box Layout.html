<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
@import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap");
:root {
    --ink:#1d2433;
    --muted:#8b92a1;
    --line:#e9ecf2;
    --purple:#6658e8;
    --soft:#f7f7fc;
}
* {
    box-sizing:border-box;
}
body {
    margin:0;
    color:var(--ink);
    background:var(--soft);
    font-family:"DM Sans", "Microsoft YaHei", sans-serif;
}
.app-shell {
    min-height:100vh;
    display:flex;
}
.sidebar {
    width:248px;
    min-height:100vh;
    padding:30px 18px 22px;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    color:#d8d9ee;
    background:#27243d;
}
.brand {
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 10px 48px;
    color:white;
    font-size:20px;
    font-weight:700;
    text-decoration:none;
}
.brand-mark {
    display:grid;
    place-items:center;
    width:32px;
    height:32px;
    border-radius:10px;
    background:linear-gradient(135deg,#9487ff,#6658e8);
    font-size:12px;
}
.main-nav {
    display:grid;
    gap:7px;
}
.nav-item {
    display:flex;
    align-items:center;
    gap:13px;
    padding:13px 14px;
    border-radius:10px;
    color:#b7b6cf;
    font-size:14px;
    text-decoration:none;
}
.nav-item span {
    width:17px;
    text-align:center;
    font-size:17px;
}
.nav-item.active,.nav-item:hover {
    color:#fff;
    background:rgba(255,255,255,.11);
}
.sidebar-footer {
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:auto;
    padding:14px 10px 0;
    border-top:1px solid rgba(255,255,255,.11);
    color:#fff;
    font-size:13px;
}
.sidebar-footer small {
    display:block;
    margin-top:3px;
    color:#aaa9c1;
}
.avatar {
    display:grid;
    place-items:center;
    width:34px;
    height:34px;
    border-radius:50%;
    background:#faaf7e;
    color:#5a3524;
    font-weight:700;
}
.content {
    width:min(100%, 1400px);
    margin:0 auto;
    padding:44px clamp(24px,5vw,72px);
}
.topbar {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:30px;
}
.eyebrow {
    margin:0 0 5px;
    color:var(--muted);
    font-size:14px;
}
.topbar h1 {
    margin:0;
    font-size:clamp(25px,3vw,34px);
    letter-spacing:-1px;
}
.notification {
    position:relative;
    width:43px;
    height:43px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    color:#3c4052;
    font-size:20px;
}
.notification span {
    position:absolute;
    right:10px;
    top:9px;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ff6b6b;
    border:1px solid white;
}
.hero {
    position:relative;
    min-height:190px;
    padding:31px clamp(25px,5vw,52px);
    display:flex;
    justify-content:space-between;
    overflow:hidden;
    border-radius:20px;
    color:white;
    background:linear-gradient(115deg,#6559df,#806fe8);
}
.hero p,.hero h2,.hero span {
    margin:0;
}
.hero p {
    opacity:.75;
    font-size:14px;
}
.hero h2 {
    margin:9px 0;
    font-size:clamp(24px,3vw,31px);
}
.hero span {
    font-size:14px;
    opacity:.8;
}
.hero-houses {
    position:absolute;
    right:clamp(20px,4vw,58px);
    top:clamp(16px,3vw,28px);
    display:flex;
    align-items:flex-start;
    gap:18px;
    width:min(100%,420px);
    max-width:420px;
}
.hero-houses img {
    width:auto;
    max-width:100%;
    height:auto;
    object-fit:contain;
    object-position:top;
}
.hero-houses img:last-child {
    max-width:40%;
}
.house-only {
    display:block;
    width:min(100%,420px);
    height:auto;
    margin:0 auto 44px;
}
.hero-houses {
    position:relative !important;
    right:auto !important;
    bottom:auto !important;
    display:flex;
    justify-content:center;
    align-items:center;
    width:min(100%,420px);
    height:auto !important;
    margin:0 auto 44px;
    opacity:1 !important;
}
.hero-houses img {
    width:100% !important;
    height:auto !important;
    object-fit:contain;
}

.hero-houses .house-light {
    position:absolute;
    z-index:1;
    top:34%;
    left:50%;
    display:none;
    width:56px !important;
    height:56px !important;
    padding:9px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(255,255,255,.88);
    box-shadow:0 4px 18px rgba(102,88,232,.3);
}
.hero-houses.light-on .house-light {
    display:block;
}
.hero-houses .house-device {
    position:absolute;
    z-index:1;
    display:none;
    width:56px !important;
    height:56px !important;
    padding:9px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(255,255,255,.88);
    box-shadow:0 4px 18px rgba(102,88,232,.3);
}
.hero-houses .house-device.is-on {
    display:block;
}
.hero-houses .device-light {
    top:34%;
    left:50%;
}
.hero-houses .device-fan {
    top:50%;
    left:40%;
}
.hero-houses .device-plug {
    top:66%;
    left:62%;
}
.db.is-selected {
    border-color:#9388ef;
    background:#e9e7ff;
}
.stats {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:17px;
    margin:24px 0 44px;
}
.stats article {
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
}
.stats img {
    width:39px;
    height:39px;
    padding:10px;
    border-radius:11px;
    background:#f0eeff;
}
.stats strong,.stats span {
    display:block;
}
.stats strong {
    font-size:19px;
}
.stats span {
    margin-top:3px;
    color:var(--muted);
    font-size:12px;
}
.section-heading {
    display:flex;
    justify-content:space-between;
    align-items:end;
    margin-bottom:18px;
}
.section-heading h2 {
    margin:0;
    font-size:21px;
}
.section-heading p {
    margin:5px 0 0;
    color:var(--muted);
    font-size:13px;
}
.section-heading a {
    color:var(--purple);
    font-size:13px;
    font-weight:600;
    text-decoration:none;
}
.db-panel {
    display:grid;
    grid-template-columns:58px minmax(0,1fr);
    gap:12px 14px;
    padding:22px;
    border:1px solid var(--line);
    border-radius:18px;
    background:#fff;
}
.db-row-label {
    display:flex;
    align-items:center;
    color:var(--muted);
    font-size:12px;
    white-space:nowrap;
}
.db-grid {
    display:grid;
    grid-template-columns:repeat(18, minmax(48px,1fr));
    gap:8px;
    min-width:0;
}
.db {
    min-height:58px;
    padding:6px 2px;
    border:1px solid #e2e4eb;
    border-radius:10px;
    color:#727988;
    background:#fafbfc;
    font-family:inherit;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
}
.db:hover {
    border-color:#a79ef6;
    color:var(--purple);
}
.db.active {
    border-color:#d8d3ff;
    color:#6153df;
    background:#f0efff;
    box-shadow:inset 0 0 0 1px #ebe9ff;
}
.db.empty {
    border-style:dashed;
    border-color:#e8eaf0;
    background:repeating-linear-gradient(135deg,#fafbfc,#fafbfc 5px,#f4f5f8 5px,#f4f5f8 10px);
}
.db.span-3 {
    grid-column:span 3;
    font-size:10px;
    line-height:1.25;
}
.db.span-3 small {
    color:inherit;
    opacity:.75;
    font-size:9px;
}
@media (min-width:1201px) and (max-width:1400px) {
    .db-grid {
        grid-template-columns:repeat(16, minmax(0,1fr));
    }
}
@media (min-width:1101px) and (max-width:1200px) {
    .db-grid {
        grid-template-columns:repeat(14, minmax(0,1fr));
    }
}
@media (min-width:1001px) and (max-width:1100px) {
    .db-grid {
        grid-template-columns:repeat(12, minmax(0,1fr));
    }
}
@media (min-width:901px) and (max-width:1000px) {
    .db-grid {
        grid-template-columns:repeat(10, minmax(0,1fr));
    }
}
@media (max-width:900px) {
    .sidebar {
        width:82px;
        padding-inline:12px;
    }
    .brand {
        margin:0 auto 48px;
    }
    .brand > :last-child,.nav-item:not(.active)::after,.nav-item {
        font-size:0;
    }
    .nav-item {
        justify-content:center;
        padding:14px;
    }
    .nav-item span {
        font-size:18px;
    }
    .sidebar-footer {
        justify-content:center;
        padding-inline:0;
    }
    .sidebar-footer div:not(.avatar) {
        display:none;
    }
    .content {
        padding:36px clamp(22px,5vw,48px);
    }
    .db-panel {
        grid-template-columns:1fr;
        gap:7px;
    }
    .db-row-label {
        margin-top:10px;
    }
    .db-grid {
        grid-template-columns:repeat(8, minmax(0,1fr));
        min-width:0;
    }
}
@media (max-width:600px) {
    .app-shell {
        display:block;
    }
    .sidebar {
        position:sticky;
        top:0;
        z-index:2;
        width:100%;
        min-height:0;
        height:68px;
        padding:10px 17px;
        flex-direction:row;
        align-items:center;
    }
    .brand {
        margin:0 16px 0 0;
    }
    .main-nav {
        display:flex;
        gap:2px;
    }
    .nav-item {
        padding:11px;
    }
    .nav-item:nth-child(n+4) {
        display:none;
    }
    .sidebar-footer {
        display:none;
    }
    .content {
        padding:28px 18px 38px;
    }
    .hero {
        min-height:175px;
    }
    .hero-houses {
        right:12px;
        bottom:-35px;
        gap:7px;
        height:165px;
        opacity:.4;
    }
    .hero-houses img {
        width:auto;
        max-width:48%;
        height:auto;
    }
    .hero-houses img:last-child {
        max-width:40%;
    }
    .stats {
        grid-template-columns:1fr;
        margin-bottom:32px;
    }
    .stats article {
        padding:14px 17px;
    }
    .section-heading {
        align-items:start;
        gap:10px;
    }
    .section-heading a {
        white-space:nowrap;
    }
    .db-panel {
        padding:15px;
    }
    .db-grid {
        grid-template-columns:repeat(4, minmax(0,1fr));
        min-width:0;
        gap:7px;
    }
    .db {
        min-height:52px;
        font-size:10px;
    }
}
@media (max-width: 900px) {
    .hero-houses {
        top: 16px;
        right: 12px;
        gap: 10px;
        width: min(100%, 320px);
    }
    .hero-houses img {
        width:auto;
        max-width:80%;
        height:auto;
    }
    .hero-houses img:last-child {
        max-width:40%;
    }
}

            <main class="content" id="overview">
                <header class="topbar">
                    <div>
                        <p class="eyebrow">欢迎回来</p>

                    </div>
                    <button class="notification" type="button" aria-label="通知">🔔<span></span></button>
                </header>

                <section class="hero">
                    <div>
                        <p>家，一切安好</p>
                        <h2>当前室温 24°C</h2>
                        <span>吉隆坡 · 晴 · 适宜</span>
                    </div>
                </section>

                <section class="stats" aria-label="设备状态">
                    <article><img src="https://ghcr.io/wens02240/DB-floorplan/raw/main/DB%20Box/photos/light.svg" alt=""><div><strong>12</strong><span>盏灯已开启</span></div></article>
                    <article><img src="https://ghcr.io/wens02240/DB-floorplan/raw/main/DB%20Box/photos/fan.svg" alt=""><div><strong>3</strong><span>设备正在运行</span></div></article>
                    <article><img src="https://ghcr.io/wens02240/DB-floorplan/raw/main/DB%20Box/photos/plug.svg" alt=""><div><strong>1.28 kW</strong><span>当前用电量</span></div></article>

                <div class="hero-houses" aria-label="房屋示意图">
                    <img src="https://ghcr.io/wens02240/DB-floorplan/raw/main/DB%20Box/photos/house_1.svg" alt="房屋示意图">
                    <img src="https://ghcr.io/wens02240/DB-floorplan/raw/main/DB%20Box/photos/house_2.svg" alt="房屋示意图">
                </div>

                <section class="section-heading screen-info">
                    <div>
                        <p>当前屏宽：
                            <strong id="screen-width">0</strong> px
                        </p>
                        <h2>DB Box 面板</h2>

                    </div>
                    <a href="#devices">查看配电布局</a>
                </section>

                <section class="db-panel" id="devices" aria-label="DB Box 设备面板">
                    <div class="db-row-label">第 1 行</div>
                    <div class="db-grid">
                        <button class="db active" type="button">DB 01</button>
                        <button class="db active" type="button">DB 02</button>
                        <button class="db active" type="button">DB 03</button>
                        <button class="db active" type="button">DB 04</button>
                        <button class="db active" type="button">DB 05</button>
                        <button class="db active" type="button">DB 06</button>
                        <button class="db active" type="button">DB 07</button>
                        <button class="db active" type="button">DB 08</button>
                        <button class="db active" type="button">DB 09</button>
                        <button class="db active" type="button">DB 10</button>
                        <button class="db active" type="button">DB 11</button>
                        <button class="db active" type="button">DB 12</button>
                        <button class="db active" type="button">DB 13</button>
                        <button class="db active" type="button">DB 14</button>
                        <button class="db active" type="button">DB 15</button>
                        <button class="db active" type="button">DB 16</button>
                        <button class="db active" type="button">DB 17</button>
                        <button class="db empty" aria-label="第 18 位空置"></button>
                    </div>

                    <div class="db-row-label">第 2 行</div>
                    <div class="db-grid">
                        <button class="db active" type="button">DB 01</button>
                        <button class="db active" type="button">DB 02</button>
                        <button class="db active" type="button">DB 03</button>
                        <button class="db active" type="button">DB 04</button>
                        <button class="db active" type="button">DB 05</button>
                        <button class="db active" type="button">DB 06</button>
                        <button class="db active" type="button">DB 07</button>
                        <button class="db active" type="button">DB 08</button>
                        <button class="db active" type="button">DB 09</button>
                        <button class="db active" type="button">DB 10</button>
                        <button class="db active" type="button">DB 11</button>
                        <button class="db active" type="button">DB 12</button>
                        <button class="db active" type="button">DB 13</button>
                        <button class="db active" type="button">DB 14</button>
                        <button class="db active" type="button">DB 15</button>
                        <button class="db active" type="button">DB 16</button>
                        <button class="db active" type="button">DB 17</button>
                        <button class="db empty" aria-label="第 18 位空置"></button>
                    </div>

                    <div class="db-row-label">第 3 行</div>
                    <div class="db-grid">
                        <button class="db active span-3" type="button">DB<br>01-03</button>
                        <button class="db active span-3" type="button">DB<br>04-06</button>
                        <button class="db active" type="button">DB 07</button>

                        <button class="db empty" aria-label="第 17 位空置"></button>
                        <button class="db empty" aria-label="第 18 位空置"></button>
                    </div>

                    <div class="db-row-label">第 4 行</div>
                    <div class="db-grid">
                        <button class="db active span-3" type="button">DB<br>01-03</button>

                        <button class="db empty" aria-label="第 7 位空置"></button>
                        <button class="db empty" aria-label="第 8 位空置"></button>
                        <button class="db empty" aria-label="第 9 位空置"></button>
                        <button class="db empty" aria-label="第 10 位空置"></button>
                        <button class="db empty" aria-label="第 11 位空置"></button>
                        <button class="db empty" aria-label="第 12 位空置"></button>
                        <button class="db empty" aria-label="第 13 位空置"></button>
                        <button class="db empty" aria-label="第 14 位空置"></button>

                        <button class="db empty" aria-label="第 17 位空置"></button>
                        <button class="db empty" aria-label="第 18 位空置"></button>
                    </div>
                </section>
            </main>
        </div>

        <script>
            const firstDbButton = document.querySelector('.db-grid .db.active');
            const houseDiagram = document.querySelector('.hero-houses');

            if (firstDbButton && houseDiagram) {
                const lightIcon = document.createElement('img');
                lightIcon.className = 'house-light';
                lightIcon.src = 'https://ghcr.io/wens02240/DB-floorplan/raw/main/DB%20Box/photos/light.svg';
                lightIcon.alt = '灯光已开启';
                houseDiagram.append(lightIcon);

                firstDbButton.setAttribute('aria-pressed', 'false');
                firstDbButton.addEventListener('click', () => {
                    const isOn = houseDiagram.classList.toggle('light-on');
                    firstDbButton.setAttribute('aria-pressed', String(isOn));
                });
            }
        </script>

        <script>
        const screenWidthEl = document.getElementById('screen-width');

        function updateScreenWidth() {
         if (!screenWidthEl) return;
            screenWidthEl.textContent = window.innerWidth;
        }

        window.addEventListener('resize', updateScreenWidth);
        window.addEventListener('load', updateScreenWidth);
        updateScreenWidth();
        </script>
